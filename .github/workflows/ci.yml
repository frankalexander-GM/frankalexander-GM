name: CI - Tests Pytest

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r demo-flask-testing/requirements.txt
          pip install pytest pytest-cov

      - name: Correr tests con pytest
        run: |
          pytest demo-flask-testing/tests/ -v --cov=demo-flask-testing --cov-report=term-missing

      - name: Correr tests calculadora clase (detalle)
        run: |
          pytest demo-flask-testing/tests/test_calculadora_clase.py -v
